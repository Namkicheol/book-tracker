<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>맘스북스 — 독서 기록</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;600&family=Nanum+Myeongjo:wght@400;700&family=Black+Han+Sans&family=Jua&family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260504c">
  <style>
    .detail-hero {
      display: flex;
      gap: var(--sp-md);
      margin-bottom: var(--sp-lg);
      padding-bottom: var(--sp-lg);
      border-bottom: 1px solid var(--border-soft);
    }
    .detail-cover, .detail-cover-placeholder {
      width: 110px;
      flex-shrink: 0;
      aspect-ratio: 2/3;
      object-fit: cover;
      border-radius: 2px;
      box-shadow: 6px 10px 0 var(--shadow), 1px 2px 0 rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.06) inset;
    }
    .detail-cover-placeholder {
      background: linear-gradient(168deg, #1c0a04 0%, #541e0c 55%, #742e18 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-han); font-size: 40px; font-weight: 700;
      color: rgba(240,210,175,0.92);
      position: relative; overflow: hidden;
      text-shadow: 0 3px 14px rgba(0,0,0,0.55);
    }
    .detail-cover-placeholder::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0; width: 7px;
      background: linear-gradient(to right, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
      border-right: 1px solid rgba(255,255,255,0.08);
    }
    .detail-cover-placeholder[data-palette="1"] { background: linear-gradient(168deg, #200808 0%, #601414 55%, #7c2020 100%); color: rgba(245,215,180,0.92); }
    .detail-cover-placeholder[data-palette="2"] { background: linear-gradient(168deg, #06101e 0%, #112848 55%, #1c3e6a 100%); color: rgba(200,222,248,0.92); }
    .detail-cover-placeholder[data-palette="3"] { background: linear-gradient(168deg, #061206 0%, #143818 55%, #1e5224 100%); color: rgba(190,232,198,0.92); }
    .detail-cover-placeholder[data-palette="4"] { background: linear-gradient(168deg, #100620 0%, #2e1054 55%, #461876 100%); color: rgba(222,198,248,0.92); }
    .detail-cover-placeholder[data-palette="5"] { background: linear-gradient(168deg, #1a0a04 0%, #501e0c 55%, #702e18 100%); color: rgba(242,212,175,0.92); }
    .detail-cover-placeholder[data-palette="6"] { background: linear-gradient(168deg, #060e12 0%, #102436 55%, #1a4258 100%); color: rgba(188,218,235,0.92); }
    .detail-cover-placeholder[data-palette="7"] { background: linear-gradient(168deg, #080e06 0%, #1e3610 55%, #2e5018 100%); color: rgba(200,228,172,0.92); }
    .detail-cover-placeholder[data-palette="8"] { background: linear-gradient(168deg, #14060e 0%, #3a1030 55%, #581848 100%); color: rgba(232,200,225,0.92); }
    .detail-meta { flex: 1; min-width: 0; }
    .detail-title {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 18px;
      line-height: 1.35;
      color: var(--text);
      margin-bottom: 6px;
    }
    .detail-author {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 13px;
      color: var(--text-soft);
      margin-bottom: 4px;
    }
    .detail-publisher {
      font-size: 12px;
      color: var(--text-mute);
      margin-bottom: var(--sp-sm);
    }
    .detail-isbn {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 10px;
      color: var(--text-mute);
      letter-spacing: 0.08em;
      opacity: 0.7;
    }
    .detail-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: var(--sp-sm); }

    .vocab-add-row { display: flex; gap: var(--sp-sm); margin-bottom: var(--sp-sm); align-items: flex-end; }
    .vocab-add-row .form-input { flex: 1; }
    .vocab-add-row .form-input:first-child { flex: 0 0 38%; }

    .vocab-list { margin-bottom: var(--sp-md); }
    .vocab-delete {
      margin-left: auto;
      color: var(--border);
      font-size: 18px;
      padding: 0 4px;
      transition: color 0.15s;
    }
    .vocab-delete:active { color: var(--wine); }

    .action-row {
      display: flex;
      gap: var(--sp-sm);
      padding-top: var(--sp-lg);
      border-top: 1px solid var(--border-soft);
      margin-top: var(--sp-xl);
    }

    /* AR badge for English books */
    .ar-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      background: var(--wine);
      color: #fff;
      border-radius: 1px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <header class="page-header">
    <a href="index.html" class="header-btn" id="backBtn">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </a>
    <span class="page-header-mini">No. 03</span>
    <span style="width:36px"></span>
  </header>

  <section class="chapter">
    <div class="chapter-glyph">録</div>
    <span class="chapter-no">No. 03 · 錄</span>
    <h1 class="chapter-title">독서 <em>기록</em></h1>
    <p class="chapter-sub">읽은 감상과 어휘를 기록합니다.</p>
  </section>

  <main class="content">

    <div class="detail-hero animate-in">
      <img class="detail-cover" id="coverImg" src="" alt="" style="display:none">
      <div class="detail-cover-placeholder" id="coverPlaceholder">書</div>
      <div class="detail-meta">
        <h2 class="detail-title" id="bookTitle">제목</h2>
        <p class="detail-author" id="bookAuthor">저자</p>
        <p class="detail-publisher" id="bookPublisher">출판사</p>
        <p class="detail-isbn" id="bookIsbn">ISBN</p>
        <div id="arBadge" class="hidden"></div>
        <div class="detail-tags" id="detailTags"></div>
      </div>
    </div>

    <form id="recordForm">

      <div class="form-group animate-in" style="animation-delay:60ms">
        <label class="form-label">별점</label>
        <div class="star-rating" id="starRating">
          <button type="button" class="star-btn" data-val="1">★</button>
          <button type="button" class="star-btn" data-val="2">★</button>
          <button type="button" class="star-btn" data-val="3">★</button>
          <button type="button" class="star-btn" data-val="4">★</button>
          <button type="button" class="star-btn" data-val="5">★</button>
        </div>
      </div>

      <div class="form-group animate-in" style="animation-delay:120ms">
        <label class="form-label" for="reviewInput">
          한줄평
          <span id="reviewCounter" style="float:right;color:var(--text-mute);font-weight:400;letter-spacing:0.04em;text-transform:none">0 / 300</span>
        </label>

        <div class="review-toolbar" role="toolbar">
          <button type="button" class="rt-btn" data-cmd="bold"      title="굵게"><strong>B</strong></button>
          <button type="button" class="rt-btn" data-cmd="underline" title="밑줄" style="text-decoration:underline">U</button>
          <span class="rt-sep"></span>
          <button type="button" class="rt-btn rt-hi" data-cmd="hilite" data-color="#ffe98a" title="노랑 형광펜 (선택 후 토글)" style="background:#ffe98a;border-color:#d9bf4d;color:#5b4a14">하</button>
          <button type="button" class="rt-btn rt-hi" data-cmd="hilite" data-color="#ffc8c8" title="핑크 형광펜 (선택 후 토글)" style="background:#ffc8c8;border-color:#d59a9a;color:#7a3a3a">하</button>
          <span class="rt-sep"></span>
          <button type="button" class="rt-btn" data-cmd="color" data-color="#8b3a3a" title="와인색 글자" style="color:#8b3a3a">A</button>
          <button type="button" class="rt-btn" data-cmd="color" data-color="#c9742f" title="오렌지 글자" style="color:#c9742f">A</button>
          <button type="button" class="rt-btn" data-cmd="color" data-color="#2d6a4f" title="녹색 글자"   style="color:#2d6a4f">A</button>
          <button type="button" class="rt-btn" data-cmd="color" data-color="#1d4e89" title="파랑 글자"   style="color:#1d4e89">A</button>
          <span class="rt-sep"></span>
          <button type="button" class="rt-btn" data-cmd="clear" title="선택한 부분 서식 지우기">서식 ✕</button>
        </div>

        <div id="reviewInput" class="form-editor" contenteditable="true"
             data-placeholder="이 책을 한 문장으로 표현한다면…"></div>

        <div class="quote-block mt-sm" id="reviewPreview" style="display:none">
          <p class="quote-text" id="reviewPreviewText"></p>
        </div>
      </div>

      <div class="form-group animate-in" style="animation-delay:180ms">
        <label class="form-label" for="dateInput">읽은 날짜</label>
        <input type="date" class="form-input" id="dateInput">
      </div>

      <div class="form-group animate-in" style="animation-delay:210ms">
        <label class="form-label" for="folderInput">폴더 (다중 선택)</label>
        <div id="folderSelect" class="folder-bar" style="margin:0;padding:0;flex-wrap:wrap"></div>
      </div>

      <div class="action-row animate-in" style="animation-delay:280ms">
        <button type="button" class="btn btn-ghost" id="deleteBtn" style="flex:1;color:var(--wine);border-color:var(--wine);box-shadow:3px 4px 0 var(--wine);display:none">
          삭제
        </button>
        <button type="submit" class="btn btn-primary" id="saveBtn" style="flex:2">
          저장
        </button>
      </div>

      <div class="action-row animate-in" style="animation-delay:320ms;border-top:none;padding-top:0;margin-top:var(--sp-md);display:none" id="shareRow">
        <button type="button" class="btn btn-secondary" id="instagramShareBtn" style="flex:1;background:linear-gradient(135deg,#E8C5FF,#FFB8C6);color:#fff;border:none;box-shadow:0 4px 12px rgba(232,197,255,0.35)">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
          이미지 공유
        </button>
      </div>

    </form>

    <!-- Recommendations (Step 6) -->
    <div id="recommendations" class="mt-xl hidden">
      <div class="divider"><span class="divider-ornament">推</span></div>

      <div class="rec-section" data-rail-id="recAuthor">
        <div class="rec-section-head">
          <div>
            <p class="section-eyebrow">같은 작가</p>
            <p class="section-title">저자의 다른 책</p>
          </div>
          <div class="rec-sort">
            <button class="rec-sort-btn active" data-rail="recAuthor" data-sort="popularity">인기순</button>
            <button class="rec-sort-btn" data-rail="recAuthor" data-sort="recent">최신순</button>
          </div>
        </div>
        <div class="rec-rail" id="recAuthor"></div>
      </div>

      <div class="rec-section mt-lg" data-rail-id="recPublisher">
        <div class="rec-section-head">
          <div>
            <p class="section-eyebrow" id="recPublisherEyebrow">유사한 책</p>
            <p class="section-title" id="recPublisherTitle">수준 비슷한 책</p>
          </div>
          <div class="rec-sort">
            <button class="rec-sort-btn active" data-rail="recPublisher" data-sort="popularity">인기순</button>
            <button class="rec-sort-btn" data-rail="recPublisher" data-sort="recent">최신순</button>
          </div>
        </div>
        <div class="rec-rail" id="recPublisher"></div>
      </div>

      <div class="rec-section mt-lg" data-rail-id="recSimilar">
        <div class="rec-section-head">
          <div>
            <p class="section-eyebrow">심화</p>
            <p class="section-title">다음 단계 추천책</p>
          </div>
          <div class="rec-sort">
            <button class="rec-sort-btn active" data-rail="recSimilar" data-sort="popularity">인기순</button>
            <button class="rec-sort-btn" data-rail="recSimilar" data-sort="recent">최신순</button>
          </div>
        </div>
        <div class="rec-rail" id="recSimilar"></div>
      </div>
    </div>

  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      서재
    </a>
    <a href="recommendations.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
      </svg>
      추천
    </a>
    <a href="scan.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/>
      </svg>
      책 추가
    </a>
    <a href="stats.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      통계
    </a>
    <a href="share.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
      공유
    </a>
  </nav>

  <div class="toast" id="toast"></div>

  <!-- Instagram 공유 모달 -->
  <div class="book-preview-modal" id="instagramModal" hidden>
    <div class="book-preview-backdrop" data-close-instagram></div>
    <div class="book-preview-card" role="dialog" aria-labelledby="instagramTitle" style="max-width:540px">
      <button type="button" class="book-preview-close" data-close-instagram aria-label="닫기">×</button>
      <div class="book-preview-body" style="padding:var(--sp-lg)">
        <h3 id="instagramTitle" style="font-family:var(--font-body);font-size:20px;font-weight:700;margin:0 0 var(--sp-sm);color:var(--text)">Instagram 공유 이미지</h3>

        <!-- 템플릿 선택 (장르별 그룹) -->
        <div style="margin-bottom:var(--sp-md)">
          <!-- 인스타 감성 -->
          <details open style="margin-bottom:12px">
            <summary style="padding:10px;background:linear-gradient(135deg,#FFE8F0,#FFF8F0);border-radius:8px;cursor:pointer;font-weight:600;color:#FF9E9E;user-select:none">
              ✨ 인스타 감성 (4)
            </summary>
            <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center">
              <button type="button" class="template-btn" data-template="1" style="padding:8px 16px;border:2px solid #FFB8C6;border-radius:8px;background:#FFF8F0;cursor:pointer;font-size:14px">
                🌸 소프트 핑크
              </button>
              <button type="button" class="template-btn" data-template="2" style="padding:8px 16px;border:2px solid #E0E0E0;border-radius:8px;background:#fff;cursor:pointer;font-size:14px">
                🍑 피치 코랄
              </button>
              <button type="button" class="template-btn" data-template="3" style="padding:8px 16px;border:2px solid #E0E0E0;border-radius:8px;background:#fff;cursor:pointer;font-size:14px">
                🌿 민트 파스텔
              </button>
              <button type="button" class="template-btn" data-template="4" style="padding:8px 16px;border:2px solid #E0E0E0;border-radius:8px;background:#fff;cursor:pointer;font-size:14px">
                ☕ 크림 베이지
              </button>
            </div>
          </details>

          <!-- 독서 감성 -->
          <details style="margin-bottom:12px">
            <summary style="padding:10px;background:linear-gradient(135deg,#F4EDE3,#FFF8E7);border-radius:8px;cursor:pointer;font-weight:600;color:#8B7355;user-select:none">
              📚 독서 감성 (3)
            </summary>
            <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center">
              <button type="button" class="template-btn" data-template="5" style="padding:8px 16px;border:2px solid #E0E0E0;border-radius:8px;background:#fff;cursor:pointer;font-size:14px">
                📖 코지 독서
              </button>
              <button type="button" class="template-btn" data-template="6" style="padding:8px 16px;border:2px solid #E0E0E0;border-radius:8px;background:#fff;cursor:pointer;font-size:14px">
                ☕ 북카페
              </button>
              <button type="button" class="template-btn" data-template="7" style="padding:8px 16px;border:2px solid #E0E0E0;border-radius:8px;background:#fff;cursor:pointer;font-size:14px">
                ✍️ 손글씨 노트
              </button>
            </div>
          </details>

          <!-- 어린이 -->
          <details style="margin-bottom:12px">
            <summary style="padding:10px;background:linear-gradient(135deg,#E8F4FF,#FFF0F5);border-radius:8px;cursor:pointer;font-weight:600;color:#5C9EE8;user-select:none">
              👶 어린이용 (4)
            </summary>
            <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center">
              <button type="button" class="template-btn" data-template="8" style="padding:8px 16px;border:2px solid #E0E0E0;border-radius:8px;background:#fff;cursor:pointer;font-size:14px">
                👧 책 읽는 아이
              </button>
              <button type="button" class="template-btn" data-template="9" style="padding:8px 16px;border:2px solid #E0E0E0;border-radius:8px;background:#fff;cursor:pointer;font-size:14px">
                🐻 동물 친구
              </button>
              <button type="button" class="template-btn" data-template="10" style="padding:8px 16px;border:2px solid #E0E0E0;border-radius:8px;background:#fff;cursor:pointer;font-size:14px">
                🚀 우주 탐험
              </button>
              <button type="button" class="template-btn" data-template="11" style="padding:8px 16px;border:2px solid #E0E0E0;border-radius:8px;background:#fff;cursor:pointer;font-size:14px">
                🦊 숲속 동화
              </button>
            </div>
          </details>

          <!-- 기본 -->
          <details style="margin-bottom:12px">
            <summary style="padding:10px;background:linear-gradient(135deg,#F0F0F0,#FAFAFA);border-radius:8px;cursor:pointer;font-weight:600;color:#718096;user-select:none">
              🎨 기본 (3)
            </summary>
            <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center">
              <button type="button" class="template-btn" data-template="12" style="padding:8px 16px;border:2px solid #E0E0E0;border-radius:8px;background:#fff;cursor:pointer;font-size:14px">
                ✨ 스티커북
              </button>
              <button type="button" class="template-btn" data-template="13" style="padding:8px 16px;border:2px solid #E0E0E0;border-radius:8px;background:#fff;cursor:pointer;font-size:14px">
                💕 포토카드
              </button>
              <button type="button" class="template-btn" data-template="14" style="padding:8px 16px;border:2px solid #E0E0E0;border-radius:8px;background:#fff;cursor:pointer;font-size:14px">
                📝 일기장
              </button>
            </div>
          </details>
        </div>

        <div style="text-align:center;margin-bottom:var(--sp-lg)">
          <canvas id="sharePreviewCanvas" style="max-width:100%;height:auto;border-radius:12px;box-shadow:0 8px 24px rgba(255,184,198,0.25)"></canvas>
        </div>

        <div style="display:flex;gap:var(--sp-sm);flex-wrap:wrap">

        </p>
      </div>
