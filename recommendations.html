<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>추천 도서 | 書架</title>
  <link rel="stylesheet" href="css/style.css?v=20260504c">
  <style>
    .rec-browse-header {
      padding: 20px 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }
    .rec-browse-title {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 8px 0;
      font-family: var(--font-han);
    }
    .rec-browse-subtitle {
      font-size: 14px;
      opacity: 0.9;
      margin: 0;
    }
    .grade-section {
      margin-bottom: 32px;
      padding: 0 16px;
    }
    .grade-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
    }
    .grade-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      margin: 0;
      font-family: var(--font-han);
    }
    .grade-count {
      font-size: 13px;
      color: var(--text-mute);
      font-weight: 600;
    }
    .rec-browse-grid {
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }
    .rec-browse-card {
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 0;
      text-align: left;
      display: flex;
      flex-direction: column;
    }
    .rec-browse-cover {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      background: linear-gradient(160deg, #f5f5f5, #e0e0e0);
    }
    .rec-browse-info {
      margin-top: 8px;
    }
    .rec-browse-book-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin: 0 0 4px 0;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .rec-browse-author {
      font-size: 11px;
      color: var(--text-mute);
      margin: 0 0 6px 0;
    }
    .rec-browse-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }
    .rec-browse-badge {
      padding: 2px 6px;
      border-radius: 2px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #fff;
    }
    .rec-empty {
      padding: 60px 16px;
      text-align: center;
      color: var(--text-mute);
    }
    .rec-search-bar {
      padding: 12px 16px 0;
      position: sticky;
      top: 0;
      background: var(--bg, #fff);
      z-index: 10;
    }
    .rec-search-input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border: 1.5px solid #e0e0e0;
      border-radius: 24px;
      font-size: 14px;
      background: #fafafa url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") no-repeat 14px center;
      transition: border-color 0.2s, background-color 0.2s;
      box-sizing: border-box;
    }
    .rec-search-input:focus {
      outline: none;
      border-color: #FF9E9E;
      background-color: #fff;
    }
    .rec-search-results {
      padding: 0 16px;
    }
    .rec-search-meta {
      padding: 12px 0;
      font-size: 13px;
      color: var(--text-mute, #888);
    }
  </style>
</head>
<body>
  <header class="rec-browse-header">
    <h1 class="rec-browse-title">📚 추천 도서</h1>
    <p class="rec-browse-subtitle">전문가들이 추천하는 초등 필독서</p>
  </header>

  <div class="rec-search-bar">
    <input type="search" id="recSearch" class="rec-search-input" placeholder="제목·저자 검색…" autocomplete="off">
  </div>

  <div id="searchResults" class="rec-search-results" hidden>
    <p class="rec-search-meta" id="searchMeta"></p>
    <div class="rec-browse-grid" id="searchGrid"></div>
  </div>

  <div id="gradeContent" style="padding-bottom:40px">
    <!-- Dynamically populated with grade sections -->
  </div>

  <!-- Reuse book preview modal from detail.html -->
  <div id="bookPreviewModal" class="book-preview-modal" hidden>
    <div class="book-preview-backdrop" data-close-preview></div>
    <div class="book-preview-card" role="dialog" aria-modal="true">
      <button type="button" class="book-preview-close" data-close-preview aria-label="닫기">×</button>
      <div class="book-preview-body" id="previewBody"></div>
    </div>
  </div>
