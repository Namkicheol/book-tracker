<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>추천 도서 | 書架</title>
  <link rel="stylesheet" href="css/style.css?v=20260510a">
  <style>
    .rec-browse-header {
      padding: 20px 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }
    .rec-browse-title {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 8px 0;
      font-family: var(--font-han);
    }
    .rec-browse-subtitle {
      font-size: 14px;
      opacity: 0.9;
      margin: 0;
    }
    .grade-section {
      margin-bottom: 32px;
      padding: 0 16px;
    }
    .grade-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
    }
    .grade-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      margin: 0;
      font-family: var(--font-han);
    }
    .grade-count {
      font-size: 13px;
      color: var(--text-mute);
      font-weight: 600;
    }
    .rec-browse-grid {
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }
    .rec-browse-card {
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 0;
      text-align: left;
      display: flex;
      flex-direction: column;
    }
    .rec-browse-cover {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      background: linear-gradient(160deg, #f5f5f5, #e0e0e0);
    }
    .rec-browse-info {
      margin-top: 8px;
    }
    .rec-browse-book-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin: 0 0 4px 0;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .rec-browse-author {
      font-size: 11px;
      color: var(--text-mute);
      margin: 0 0 6px 0;
    }
    .rec-browse-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }
    .rec-browse-badge {
      padding: 2px 6px;
      border-radius: 2px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #fff;
    }
    .rec-empty {
      padding: 60px 16px;
      text-align: center;
      color: var(--text-mute);
    }
    .rec-search-bar {
      padding: 12px 16px 0;
      position: sticky;
      top: 0;
      background: var(--bg, #fff);
      z-index: 10;
    }
    .rec-search-input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border: 1.5px solid #e0e0e0;
      border-radius: 24px;
      font-size: 14px;
      background: #fafafa url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") no-repeat 14px center;
      transition: border-color 0.2s, background-color 0.2s;
      box-sizing: border-box;
    }
    .rec-search-input:focus {
      outline: none;
      border-color: #FF9E9E;
      background-color: #fff;
    }
    .rec-search-results {
      padding: 0 16px;
    }
    .rec-search-meta {
      padding: 12px 0;
      font-size: 13px;
      color: var(--text-mute, #888);
    }
    /* 유치원 특선 테마별 그리드 — 권수가 적어도 가운데 정렬 */
    .kinder-book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 160px));
      gap: 12px;
      padding: 0 16px 12px;
      justify-content: center;
    }
    .kinder-book-grid.list-view {
      grid-template-columns: 1fr !important;
      justify-content: start;
      gap: 6px;
    }
    /* 유치원 특선 접기/펼치기 */
    .kinder-summary {
      padding: 16px;
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      user-select: none;
      background: var(--bg, #fff);
    }
    .kinder-summary::-webkit-details-marker { display: none; }
    .kinder-chevron { transition: transform 0.2s ease; flex-shrink: 0; color: var(--text-mute, #999); }
    #kinderSection[open] .kinder-chevron { transform: rotate(180deg); }
  </style>
</head>
<body>
  <header class="rec-browse-header">
    <h1 class="rec-browse-title">📚 추천 도서</h1>
    <p class="rec-browse-subtitle">전문가들이 추천하는 초등 필독서</p>
  </header>

  <div class="rec-search-bar">
    <input type="search" id="recSearch" class="rec-search-input" placeholder="제목·저자 검색…" autocomplete="off">
  </div>

  <!-- 모드 탭 -->
  <div id="modeTabs" style="display:flex;gap:0;border-bottom:2px solid #e0e0e0;background:#fff;position:sticky;top:56px;z-index:9;align-items:center">
    <button id="modeAll" class="mode-tab mode-tab-active" style="flex:1;padding:10px 0;font-size:13px;font-weight:600;border:none;background:transparent;color:#FF6B6B;border-bottom:2px solid #FF6B6B;margin-bottom:-2px;cursor:pointer">전체 추천</button>
    <button id="modeTextbook" class="mode-tab" style="flex:1;padding:10px 0;font-size:13px;font-weight:600;border:none;background:transparent;color:#999;cursor:pointer">📖 교과서 학년별</button>
  </div>

  <div id="searchResults" class="rec-search-results" hidden>
    <p class="rec-search-meta" id="searchMeta"></p>
    <div class="rec-browse-grid" id="searchGrid"></div>
  </div>

  <div id="gradeContent" style="padding-bottom:40px">
    <!-- Dynamically populated with grade sections -->
  </div>

  <!-- 추천 기관 전용 페이지 (배지 클릭 시 표시) -->
  <div id="sourceView" hidden style="padding-bottom:40px">
    <div id="sourceViewHeader" style="padding:20px 16px 16px;color:#fff;position:relative">
      <button id="sourceBackBtn" aria-label="뒤로" style="position:absolute;top:14px;left:12px;background:rgba(255,255,255,0.2);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)">←</button>
      <div style="padding-left:44px">
        <div id="sourceViewBadge" style="display:inline-block;padding:4px 10px;background:rgba(255,255,255,0.22);border-radius:12px;font-size:11px;font-weight:700;letter-spacing:0.06em;margin-bottom:6px"></div>
        <h1 id="sourceViewTitle" style="font-family:var(--font-han);font-size:22px;font-weight:700;margin:0 0 4px 0"></h1>
        <p id="sourceViewDesc" style="font-size:12px;opacity:0.92;margin:0;line-height:1.45"></p>
        <div id="sourceViewCount" style="font-size:11px;opacity:0.85;margin-top:8px;font-weight:600"></div>
      </div>
    </div>
    <div id="sourceGradeTabs" style="display:flex;gap:6px;padding:12px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-bottom:1px solid #f0f0f0;background:#fff;position:sticky;top:0;z-index:9"></div>
    <div class="rec-browse-grid list-view" id="sourceGrid" style="padding:0 16px"></div>
  </div>

  <!-- Scroll to top -->
  <button id="scrollTopBtn" class="scroll-top-btn" aria-label="맨 위로">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <!-- Reuse book preview modal from detail.html -->
  <div id="bookPreviewModal" class="book-preview-modal" hidden>
    <div class="book-preview-backdrop" data-close-preview></div>
    <div class="book-preview-card" role="dialog" aria-modal="true">
      <button type="button" class="book-preview-close" data-close-preview aria-label="닫기">×</button>
      <div class="book-preview-body" id="previewBody"></div>
    </div>
  </div>

</body>
