<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>맘스북스 — 설정</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400;1,9..144,500&family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260509a">
  <style>
    .settings-section {
      margin-bottom: var(--sp-lg);
    }
    .settings-section-title {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-mute);
      padding: 0 var(--sp-md);
      margin-bottom: var(--sp-xs);
    }
    .settings-list {
      background: var(--bg-paper);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px var(--sp-md);
      border-bottom: 1px solid var(--border-soft);
      gap: var(--sp-md);
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-row-label {
      font-family: var(--font-body);
      font-size: 15px;
      color: var(--text);
    }
    .settings-row-desc {
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--text-mute);
      margin-top: 2px;
    }
    /* Toggle switch */
    .toggle-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .toggle-input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-track {
      display: block;
      width: 48px;
      height: 28px;
      background: var(--border);
      border-radius: 100px;
      cursor: pointer;
      transition: background 0.2s;
      position: relative;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }
    .toggle-input:checked + .toggle-track {
      background: var(--accent);
    }
    .toggle-input:checked + .toggle-track::after {
      transform: translateX(20px);
    }
    .settings-version {
      text-align: center;
      font-family: var(--font-display);
      font-style: italic;
      font-size: 11px;
      color: var(--text-mute);
      padding: var(--sp-lg) var(--sp-md);
    }
  </style>
</head>
<body>

  <header class="page-header">
    <a href="javascript:history.back()" class="header-btn" aria-label="뒤로">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </a>
    <span class="page-header-mini">Settings</span>
    <span style="width:42px"></span>
  </header>

  <section class="chapter" style="padding-bottom:var(--sp-md)">
    <span class="chapter-no">Preferences</span>
    <h1 class="chapter-title">설정</h1>
  </section>

  <main class="content" style="padding-top:0">

    <div class="settings-section">
      <p class="settings-section-title">화면</p>
      <div class="settings-list">
        <div class="settings-row">
          <div>
            <div class="settings-row-label">다크 모드</div>
            <div class="settings-row-desc">어두운 배경으로 전환합니다</div>
          </div>
          <label class="toggle-wrap">
            <input type="checkbox" class="toggle-input" id="darkToggle">
            <span class="toggle-track"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <p class="settings-section-title">공개 범위</p>
      <div class="settings-list">
        <div class="settings-row" style="flex-direction:column;align-items:stretch;gap:10px">
          <div>
            <div class="settings-row-label">내 서재를 누가 볼 수 있나요</div>
            <div class="settings-row-desc">
              비공개로 두면 다른 엄마들의 서재도 볼 수 없어요. 친구들과 책 추천을 주고받으려면 공개가 필요합니다.
            </div>
          </div>
          <select id="privacySelect"
            style="padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;background:var(--bg-paper);color:var(--text);width:100%">
            <option value="public">🌍 전체 공개 — 모든 엄마들에게 (기본)</option>
            <option value="school">👯 같은 학교 친구들에게만</option>
            <option value="private">🔒 비공개 — 나만 보기</option>
          </select>
          <div id="privacyWarning" style="display:none;background:#FFF8F0;border:1.5px dashed #FFB8C6;border-radius:10px;padding:10px;font-size:12px;color:#FF7B7B;line-height:1.55">
            ⚠️ 비공개 상태에서는 <b>다른 사람의 서재도 볼 수 없어요</b>. 공개로 바꾸면 같은 학교 친구·다른 엄마들의 서재를 둘러볼 수 있습니다.
          </div>
        </div>
      </div>
    </div>

    <p class="settings-version">맘스북스 · 2026</p>

  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      서재
    </a>
    <a href="recommendations.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
      </svg>
      추천
    </a>
    <a href="scan.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/>
      </svg>
      책 추가

    <a href="stats.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>

      통계

    <a href="share.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
        <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
        <path d="M4 22h16"/>
        <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
        <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
        <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
      </svg>
      랭킹

  <script src="js/theme.js?v=20260510a"></script>
  <script src="js/config.js?v=20260510a"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js?v=20260510b"></script>
  <script src="js/auth-ui.js?v=20260510o"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const toggle = document.getElementById('darkToggle');
      const current = document.documentElement.dataset.theme;
      toggle.checked = current === 'dark';

      toggle.addEventListener('change', function () {
        const next = toggle.checked ? 'dark' : 'light';
        const KEY = 'momsbooks.theme';
        document.documentElement.dataset.theme = next;
        localStorage.setItem(KEY, next);
      });

      // Sync if changed via system
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        if (!localStorage.getItem('momsbooks.theme')) {
          toggle.checked = e.matches;
        }
      });

      // ── 공개 범위 ──────────────────────────────────────────────
      const privacySel = document.getElementById('privacySelect');
      const privacyWarn = document.getElementById('privacyWarning');
      const curPrivacy = localStorage.getItem('profilePrivacy') || 'public';
      privacySel.value = curPrivacy;
      privacyWarn.style.display = curPrivacy === 'private' ? 'block' : 'none';

      privacySel.addEventListener('change', function () {
        const v = privacySel.value;
        localStorage.setItem('profilePrivacy', v);
        privacyWarn.style.display = v === 'private' ? 'block' : 'none';
        // 로그인 상태면 Supabase에도 반영 (실패해도 localStorage는 이미 저장됨)
        if (window.SB && window.SB.enabled) {
          window.SB.upsertProfile({ privacy: v }).catch(() => {});
        }
      });
    });
  </script>
</body>
</html>
