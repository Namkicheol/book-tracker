<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FF9E9E">
  <title>연결을 기다리고 있어요 · 맘스북스</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff5f3;color:#70525d;font-family:Georgia,'Apple SD Gothic Neo',sans-serif}
    main{max-width:380px;text-align:center;padding:36px 24px;background:#fffdf9;border:1px solid #f0d7df;border-radius:28px}small{font-size:16px;font-weight:700;color:#b96980}h1{font-size:24px;line-height:1.5;margin:24px 0 14px}p{font-size:15px;line-height:1.8;margin:0 0 28px}button,a{display:block;width:100%;border-radius:14px;padding:15px;font:inherit;text-decoration:none;cursor:pointer}button{border:0;background:#ffb2bd;color:#5c3a46;font-weight:700}a{color:#956577;margin-top:8px}button:focus-visible,a:focus-visible{outline:3px solid #a65e79;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <small>맘스북스</small>
    <h1>인터넷 연결을<br>기다리고 있어요</h1>
    <p>이 화면은 연결된 상태에서 열어 주세요.<br>다시 연결되면 이어서 사용할 수 있어요.<br>기기에 저장된 독서 기록은 지워지지 않아요.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
    <a href="/index.html">내 서재로</a>
  </main>
</body>
</html>
